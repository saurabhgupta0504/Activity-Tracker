<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4F7CAC">
<title>Activity Tracker</title>
 <link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, Roboto, Arial, sans-serif; background: #F3F6F9; color: #25324A; }
  .screen { display: none; min-height: 100vh; padding: 24px 20px 40px; max-width: 480px; margin: 0 auto; }
  .screen.active { display: block; }
  h1 { font-size: 28px; margin: 48px 0 40px; text-align: center; }
  h2 { font-size: 22px; margin: 8px 0 18px; }
  .btn { display: block; width: 100%; padding: 18px; font-size: 18px; font-weight: 600; border: none; border-radius: 14px; color: #fff; background: #4F7CAC; margin-top: 16px; }
  .btn.green { background: #5B9A8B; }
  .btn.grey { background: #E3E8EE; color: #25324A; }
  .link { display: block; margin: 22px auto 0; background: none; border: none; font-size: 16px; color: #4F7CAC; }
  label { display: block; margin: 18px 0 6px; font-size: 15px; color: #52607A; }
  input { width: 100%; padding: 14px; font-size: 17px; border: 1px solid #CBD5E1; border-radius: 12px; background: #fff; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .hint { font-size: 13px; color: #7A879C; margin-top: 10px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { flex: 1; padding: 12px 0; border: none; border-radius: 10px; background: #E3E8EE; font-size: 15px; font-weight: 600; color: #52607A; }
  .tab.on { background: #4F7CAC; color: #fff; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-top: 14px; }
  .card .lbl { font-size: 14px; color: #7A879C; margin-bottom: 6px; }
  .big { font-size: 34px; font-weight: 700; }
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 130px; margin-top: 8px; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar { width: 70%; background: #4F7CAC; border-radius: 4px; min-height: 4px; }
  .bl { font-size: 10px; color: #7A879C; margin-top: 4px; }
  .item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #EEF1F5; }
  .item:last-child { border-bottom: none; }
  .item span:first-child { text-transform: capitalize; }
  .item span:last-child { font-weight: 600; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #25324A; color: #fff; padding: 12px 22px; border-radius: 24px; font-size: 15px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <h1>Activity Tracker</h1>
  <button class="btn" onclick="show('add')">Add New Activity</button>
  <button class="btn green" onclick="openAnalyze()">Analyze</button>
  <button class="link" onclick="show('backup')">Backup</button>
</div>

<!-- ADD -->
<div id="add" class="screen">
  <h2>New Activity</h2>
  <label>What did you do?</label>
  <input id="name" type="text" placeholder="e.g. Studied maths">
  <label>Total time taken</label>
  <div class="row">
    <input id="hrs" type="number" inputmode="numeric" min="0" placeholder="Hours">
    <input id="min" type="number" inputmode="numeric" min="0" max="59" placeholder="Minutes">
  </div>
  <p class="hint">Date and time are added automatically when you save.</p>
  <button class="btn" onclick="saveActivity()">Save</button>
  <button class="link" onclick="show('home')">Back</button>
</div>

<!-- ANALYZE -->
<div id="analyze" class="screen">
  <h2 id="atitle">This Week</h2>
  <div class="tabs">
    <button class="tab" id="t-day" onclick="setMode('day')">Daily</button>
    <button class="tab on" id="t-week" onclick="setMode('week')">Weekly</button>
    <button class="tab" id="t-month" onclick="setMode('month')">Monthly</button>
  </div>
  <div class="card"><div class="lbl">Total time logged</div><div class="big" id="total">0m</div><div class="hint" id="count"></div></div>
  <div class="card" id="chartCard"><div class="lbl" id="chartLbl">By day</div><div class="chart" id="chart"></div></div>
  <div class="card"><div class="lbl">Time per activity</div><div id="list"></div></div>
  <button class="link" onclick="show('home')">Back</button>
</div>

<!-- BACKUP -->
<div id="backup" class="screen">
  <h2>Backup</h2>
  <p class="hint">Save a copy of all your logs, or load one back.</p>
  <button class="btn" onclick="exportData()">Save a backup file</button>
  <button class="btn grey" onclick="document.getElementById('file').click()">Load a backup file</button>
  <input type="file" id="file" accept=".json" style="display:none" onchange="importData(event)">
  <button class="link" onclick="show('home')">Back</button>
</div>

<div id="toast"></div>

<script>
const KEY = 'activity_logs_v1';
let mode = 'week';

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
const store = (logs) => localStorage.setItem(KEY, JSON.stringify(logs));

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ---------- add ----------
function saveActivity() {
  const name = document.getElementById('name').value.trim();
  const h = parseInt(document.getElementById('hrs').value || '0', 10);
  const m = parseInt(document.getElementById('min').value || '0', 10);
  if (!name) return toast('Please enter the activity');
  if (isNaN(h) || isNaN(m) || h < 0 || m < 0 || m > 59) return toast('Minutes should be 0 to 59');
  const total = h * 60 + m;
  if (total === 0) return toast('Please enter the time taken');
  const logs = load();
  logs.push({ id: Date.now().toString(), name, minutes: total, timestamp: new Date().toISOString() });
  store(logs);
  document.getElementById('name').value = '';
  document.getElementById('hrs').value = '';
  document.getElementById('min').value = '';
  toast('Saved');
  show('home');
}

// ---------- analyze ----------
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const dayKey = d => { const x = new Date(d); return x.getFullYear() + '-' + (x.getMonth()+1) + '-' + x.getDate(); };
const fmt = mins => { const h = Math.floor(mins/60), m = mins % 60; return h && m ? h+'h '+m+'m' : h ? h+'h' : m+'m'; };
function weekStart(d) { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; }

function openAnalyze() { mode = 'week'; show('analyze'); render(); }
function setMode(m) { mode = m; render(); }

function render() {
  const now = new Date();
  ['day','week','month'].forEach(k => document.getElementById('t-'+k).classList.toggle('on', k === mode));
  document.getElementById('atitle').textContent = { day: 'Today', week: 'This Week', month: 'This Month' }[mode];

  const logs = load().filter(l => {
    const d = new Date(l.timestamp);
    if (mode === 'day') return dayKey(d) === dayKey(now);
    if (mode === 'week') return d >= weekStart(now);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });

  const total = logs.reduce((s, l) => s + l.minutes, 0);
  document.getElementById('total').textContent = fmt(total);
  document.getElementById('count').textContent = logs.length + (logs.length === 1 ? ' activity' : ' activities');

  // chart
  let bars = [];
  if (mode === 'week') {
    const start = weekStart(now);
    bars = DAYS.map((label, i) => {
      const d = new Date(start); d.setDate(start.getDate() + i);
      return { label, mins: logs.filter(l => dayKey(l.timestamp) === dayKey(d)).reduce((s, l) => s + l.minutes, 0) };
    });
  } else if (mode === 'month') {
    const n = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    for (let i = 1; i <= n; i++) bars.push({ label: String(i), mins: logs.filter(l => new Date(l.timestamp).getDate() === i).reduce((s, l) => s + l.minutes, 0) });
  }
  const card = document.getElementById('chartCard');
  card.style.display = bars.length ? 'block' : 'none';
  document.getElementById('chartLbl').textContent = mode === 'week' ? 'By day' : 'By date';
  const max = Math.max(1, ...bars.map(b => b.mins));
  document.getElementById('chart').innerHTML = bars.map(b =>
    '<div class="col"><div class="bar" style="height:' + Math.max(3, (b.mins/max)*100) + '%"></div><div class="bl">' + b.label + '</div></div>').join('');

  // per activity
  const per = {};
  logs.forEach(l => { const k = l.name.toLowerCase(); per[k] = (per[k] || 0) + l.minutes; });
  const rows = Object.entries(per).sort((a, b) => b[1] - a[1]);
  document.getElementById('list').innerHTML = rows.length
    ? rows.map(r => '<div class="item"><span>' + r[0].replace(/</g,'&lt;') + '</span><span>' + fmt(r[1]) + '</span></div>').join('')
    : '<div class="hint">Nothing logged for this period yet.</div>';
}

// ---------- backup ----------
function exportData() {
  const blob = new Blob([JSON.stringify(load(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'activity-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('Backup saved to Downloads');
}

function importData(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const incoming = JSON.parse(r.result);
      const have = load();
      const ids = new Set(have.map(x => x.id));
      incoming.forEach(x => { if (!ids.has(x.id)) have.push(x); });
      store(have);
      toast('Backup loaded');
    } catch (err) { toast('That file could not be read'); }
  };
  r.readAsText(f);
}
 if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
 }
</script>
</body>
</html>
